plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.knz.pvpenhancer.PvpEnhancerTest'

// Directory the RuneLite client scans for side-loaded plugins when launched
// with --developer-mode. The installPlugin task drops the built jar here.
def sideloadDir = "${System.getProperty('user.home')}/.runelite/sideloaded-plugins"

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.mockito:mockito-core:5.11.0'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.knz.pvpenhancer'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	// Production target is Java 11 (RuneLite constraint). A newer JDK may build it.
	options.release.set(11)
}

// Launches a full RuneLite client in developer mode with this plugin loaded from the
// classpath via ExternalPluginManager.loadBuiltin (see PvpEnhancerTest). This is the
// primary development loop — no jar is built or copied, and code changes take effect on
// the next run. Do NOT also keep the jar in ~/.runelite/sideloaded-plugins while using
// this task, or the plugin loads twice (once from the classpath, once side-loaded).
// The --add-opens is required so loadBuiltin's reflection works on JDK 17+.
tasks.register('run', JavaExec) {
	group = 'runelite'
	description = 'Run RuneLite in developer mode with the plugin loaded from the classpath'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass
	jvmArgs '-ea', '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED', '--add-opens=java.base/java.lang=ALL-UNNAMED'
	args '--developer-mode', '--debug'
}

// OPT-IN ONLY. Copies the built plugin jar into the RuneLite side-load directory so a
// standalone client started with --developer-mode can load it. Run explicitly:
//   ./gradlew installPlugin
// WARNING: do NOT use this together with `./gradlew run`. `run` already loads the plugin
// from the classpath; if the jar is also present in sideloaded-plugins, developer mode
// loads it a SECOND time and the plugin appears twice. This task is deliberately NOT
// wired into `build` for that reason.
tasks.register('installPlugin', Copy) {
	group = 'runelite'
	description = 'Opt-in: copy the plugin jar into ~/.runelite/sideloaded-plugins (do not combine with run)'
	dependsOn tasks.named('jar')
	from tasks.named('jar').flatMap { it.archiveFile }
	into sideloadDir
	doLast {
		println "Installed plugin jar to ${sideloadDir}"
		println "NOTE: use this for a standalone --developer-mode client only. Do not also run `gradlew run`, or the plugin loads twice."
	}
}
